<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="452" viewBox="0 0 1280 452" role="img" aria-labelledby="title desc">
  <title id="title">IPC Filter Farm 핵심 기능</title>
  <desc id="desc">IPC Filter Farm의 핵심 기능. 필수 3종(익명 pipe·SysV MQ·SysV SHM)과 선택 확장 2종(FIFO·POSIX SHM)을 48B 공통 헤더와 동일 인터페이스로 비교한다. 서버는 유계 링과 워커 풀로 최대 4클라의 PPM P6 이미지에 GRAY·BLUR·EDGE 필터를 적용하고 fcntl 잠금으로 수명과 자원 정리를 관리한다. 1단계 기초 벤치와 2단계 S1~S5 시나리오로 RTT·처리량·CPU·RSS를 계측하고 단일 요인 실험과 strace 진단으로 병목을 검증·개선한다.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #1A2028; }
    .heading { font-size: 27px; font-weight: 700; }
    .subtitle { font-size: 19px; fill: #525862; }
    .body { font-size: 19px; }
    .label { font-size: 18px; font-weight: 700; fill: #2D56B6; }
    .role { font-size: 17px; font-weight: 700; fill: #2D56B6; }
    .icon { fill: none; stroke: #2D56B6; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1280" height="452" rx="16" fill="#F1F4F8"/>
  <g transform="translate(24 24)">
    <rect width="400" height="404" rx="14" fill="#FFFFFF" stroke="#DBDEE3"/>
    <rect x="24" y="24" width="64" height="64" rx="16" fill="#E7EDF9"/>
    <g class="icon" transform="translate(32 32)" aria-hidden="true"><path d="M8 15h32M33 9l7 6-7 6M40 33H8M15 27l-7 6 7 6"/></g>
    <text x="104" y="63" class="label">01 | IPC 백엔드</text>
    <text x="24" y="132" class="heading">공통 인터페이스로 비교</text>
    <text x="24" y="164" class="subtitle">필수 3종 · 선택 확장 2종 IPC</text>
    <path d="M24 190H376" stroke="#DBDEE3"/>
    <text x="24" y="226" class="role">필수 비교 · 3종</text>
    <text x="24" y="257" class="body">익명 pipe · SysV MQ · SysV SHM</text>
    <text x="24" y="315" class="role">선택 확장 · 공정성</text>
    <text x="24" y="346" class="body">FIFO · POSIX SHM · 48B 헤더</text>
  </g>
  <g transform="translate(440 24)">
    <rect width="400" height="404" rx="14" fill="#FFFFFF" stroke="#DBDEE3"/>
    <rect x="24" y="24" width="64" height="64" rx="16" fill="#E7EDF9"/>
    <g class="icon" transform="translate(32 32)" aria-hidden="true"><rect x="5" y="7" width="38" height="34" rx="5"/><circle cx="16" cy="18" r="3.5"/><path d="M5 35l11-10 8 7 6-5 13 10"/></g>
    <text x="104" y="63" class="label">02 | 이미지 필터</text>
    <text x="24" y="132" class="heading">다중 클라 이미지 처리</text>
    <text x="24" y="164" class="subtitle">PPM P6 · GRAY · BLUR · EDGE</text>
    <path d="M24 190H376" stroke="#DBDEE3"/>
    <text x="24" y="226" class="role">서버 파이프라인</text>
    <text x="24" y="257" class="body">유계 링 · 워커 풀 · 체크섬 검증</text>
    <text x="24" y="315" class="role">동시성 · 안전 종료</text>
    <text x="24" y="346" class="body">최대 4클라 · fcntl 잠금 · 자원 정리</text>
  </g>
  <g transform="translate(856 24)">
    <rect width="400" height="404" rx="14" fill="#FFFFFF" stroke="#DBDEE3"/>
    <rect x="24" y="24" width="64" height="64" rx="16" fill="#E7EDF9"/>
    <g class="icon" transform="translate(32 32)" aria-hidden="true"><path d="M6 40h36M11 40V26M21 40V18M31 40V11M11 19l10-6 10-6 8 4"/></g>
    <text x="104" y="63" class="label">03 | 측정·개선</text>
    <text x="24" y="132" class="heading">벤치 측정과 병목 개선</text>
    <text x="24" y="164" class="subtitle">1단계 기초 · 2단계 S1~S5 시나리오</text>
    <path d="M24 190H376" stroke="#DBDEE3"/>
    <text x="24" y="226" class="role">성능 · 자원 계측</text>
    <text x="24" y="257" class="body">RTT p50·p99 · 처리량 · CPU·RSS</text>
    <text x="24" y="315" class="role">검증 · 개선 비교</text>
    <text x="24" y="346" class="body">단일 요인 실험 · strace · 그래프</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1568" height="452" viewBox="0 0 1568 452" role="img" aria-labelledby="title desc">
  <title id="title">IPC Filter Farm 시스템 아키텍처</title>
  <desc id="desc">Linux 로컬 IPC 성능을 측정하고 이미지 필터를 처리하는 C11 기반 벤치·응용 시스템. 클라이언트에서 5종 로컬 IPC를 거쳐 필터 서버로 요청·응답이 오가고 양측이 기록한 RTT·자원 CSV를 벤치 도구가 집계·시각화하는 실행·데이터 흐름이며 화살표는 소스 의존성이 아니다. 응용 코드는 src/ipc/ipc.c 테이블과 공통 6함수 인터페이스로 백엔드 분기를 분리하고 fcntl 레코드 잠금으로 채널 수명을 관리한다.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #1A2028; }
    .heading { font-size: 27px; font-weight: 700; }
    .subtitle { font-size: 19px; fill: #525862; }
    .body { font-size: 19px; }
    .label { font-size: 18px; font-weight: 700; fill: #2D56B6; }
    .role { font-size: 17px; font-weight: 700; fill: #2D56B6; }
    .icon { fill: none; stroke: #2D56B6; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1568" height="452" rx="16" fill="#F1F4F8"/>
  <g transform="translate(24 24)">
    <rect width="400" height="404" rx="14" fill="#FFFFFF" stroke="#DBDEE3"/>
    <rect x="24" y="24" width="64" height="64" rx="16" fill="#E7EDF9"/>
    <g class="icon" transform="translate(32 32)" aria-hidden="true"><rect x="4" y="6" width="40" height="36" rx="5"/><path d="M4 15h40M13 24l6 5-6 5M23 34h11"/></g>
    <text x="104" y="63" class="label">01 | 요청 생성</text>
    <text x="24" y="126" class="heading">클라이언트</text>
    <text x="24" y="154" class="subtitle">1~4 클라(기초 1~8) · PPM P6</text>
    <text x="24" y="181" class="subtitle">C11 · pthread · pipe_run</text>
    <path d="M24 200H376" stroke="#DBDEE3"/>
    <text x="24" y="233" class="role">sender · receiver</text>
    <text x="24" y="264" class="body">inflight 제어 · 체크섬·RTT 기록</text>
    <text x="24" y="315" class="role">stats · 정상 종료</text>
    <text x="24" y="346" class="body">경계 자원 계측 · 완료 후 BYE</text>
  </g>
  <g transform="translate(584 24)">
    <rect width="400" height="404" rx="14" fill="#FFFFFF" stroke="#DBDEE3"/>
    <rect x="24" y="24" width="64" height="64" rx="16" fill="#E7EDF9"/>
    <g class="icon" transform="translate(32 32)" aria-hidden="true"><rect x="4" y="5" width="40" height="16" rx="4"/><rect x="4" y="27" width="40" height="16" rx="4"/><path d="M12 13h1M12 35h1M23 13h13M23 35h13"/></g>
    <text x="104" y="63" class="label">02 | IPC · 핵심 처리</text>
    <text x="24" y="126" class="heading">필터 서버</text>
    <text x="24" y="154" class="subtitle">공통 6함수 IPC · 48B 헤더</text>
    <text x="24" y="181" class="subtitle">pipe · MQ · SHM · FIFO</text>
    <path d="M24 200H376" stroke="#DBDEE3"/>
    <text x="24" y="233" class="role">채널 · 수명 관리</text>
    <text x="24" y="264" class="body">fcntl 레코드 잠금 · 사망 퇴역</text>
    <text x="24" y="315" class="role">워커 파이프라인</text>
    <text x="24" y="346" class="body">jobs → 워커 N → done · 필터</text>
  </g>
  <g transform="translate(1144 24)">
    <rect width="400" height="404" rx="14" fill="#FFFFFF" stroke="#DBDEE3"/>
    <rect x="24" y="24" width="64" height="64" rx="16" fill="#E7EDF9"/>
    <g class="icon" transform="translate(32 32)" aria-hidden="true"><rect x="5" y="5" width="38" height="38" rx="6"/><path d="M14 34v-9M24 34V16M34 34V22"/></g>
    <text x="104" y="63" class="label">03 | 측정 · 검증</text>
    <text x="24" y="126" class="heading">벤치 · 시각화</text>
    <text x="24" y="154" class="subtitle">1단계 기초 · 2단계 S1~S5</text>
    <text x="24" y="181" class="subtitle">Bash · C 집계 · matplotlib</text>
    <path d="M24 200H376" stroke="#DBDEE3"/>
    <text x="24" y="233" class="role">측정 · 진단</text>
    <text x="24" y="264" class="body">run_bench.sh · strace · 데모</text>
    <text x="24" y="315" class="role">집계 · 그래프</text>
    <text x="24" y="346" class="body">p50·p99 · 처리량 · CPU·RSS</text>
  </g>
  <g>
    <text x="504" y="207" class="role" text-anchor="middle">5종 로컬 IPC</text>
    <text x="1064" y="207" class="role" text-anchor="middle">계측 · CSV</text>
    <path d="M440 226H568m-8-6 8 6-8 6M1000 226H1128m-8-6 8 6-8 6" fill="none" stroke="#2D56B6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>
  </g>
</svg>

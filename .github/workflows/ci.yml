name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and check headers
        run: make -j2 all check-headers
      - name: Unit and IPC regression tests
        run: make test test-mq test-shm
      - name: Submission result validation regression
        run: |
          python3 tests/test_check_results.py
          python3 tests/test_package.py
          bash tests/test_aggregate.sh
      - name: Application and pipe regression tests
        run: |
          for ipc in fifo sysv_mq sysv_shm posix_shm; do
            make test-app IPC="$ipc"
          done
          make test-pipe test-bench

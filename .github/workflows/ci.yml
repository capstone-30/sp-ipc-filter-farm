name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and check headers
        run: make -j2 all check-headers
      - name: Unit and IPC regression tests
        run: make test test-mq test-shm
      - name: Submission result validation regression
        run: python3 tests/test_check_results.py
